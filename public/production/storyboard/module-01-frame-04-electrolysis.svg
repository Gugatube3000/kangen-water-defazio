<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Module 1 Frame 4 - Introduce ERW</title>
  <desc id="desc">An electrolysis chamber splits mineral water into reducing and oxidizing streams.</desc>
  <defs>
    <linearGradient id="flow" x1="0" x2="1"><stop offset="0%" stop-color="#39D6E8"/><stop offset="100%" stop-color="#F2FEFF"/></linearGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse"><path d="M96 0H0v96" fill="none" stroke="#A4E7F0" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="#071827"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <text x="120" y="132" fill="#A4E7F0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="8">FRAME 04 / INTRODUCE ERW</text>
  <g transform="translate(540 232)">
    <rect x="0" y="0" width="840" height="480" rx="58" fill="#FFFFFF" fill-opacity=".035" stroke="#A4E7F0" stroke-opacity=".28" stroke-width="4"/>
    <path d="M-220 240H120" stroke="url(#flow)" stroke-width="24" stroke-linecap="round"/>
    <path d="M720 240h330" stroke="url(#flow)" stroke-width="24" stroke-linecap="round"/>
    <path d="M420 90v300" stroke="#E6FDFF" stroke-opacity=".55" stroke-width="10" stroke-linecap="round"/>
    <path d="M340 90v300" stroke="#E6FDFF" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/>
    <path d="M500 90v300" stroke="#E6FDFF" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/>
    <circle cx="282" cy="168" r="18" fill="#A4E7F0" fill-opacity=".78"/>
    <circle cx="590" cy="304" r="13" fill="#A4E7F0" fill-opacity=".68"/>
    <circle cx="628" cy="184" r="10" fill="#FFFFFF" fill-opacity=".75"/>
    <path d="M420 430C276 526 168 572 56 610" fill="none" stroke="#39D6E8" stroke-width="18" stroke-linecap="round"/>
    <path d="M420 430c154 98 274 144 390 182" fill="none" stroke="#7DD9FF" stroke-width="18" stroke-linecap="round"/>
  </g>
  <text x="250" y="860" fill="#A4E7F0" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="6">ALKALINE / REDUCING</text>
  <text x="1258" y="860" fill="#9FDFFF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="6">ACIDIC / OXIDIZING</text>
  <text x="120" y="964" fill="#F3FAFF" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="700">ERW is electrically charged through electrolysis.</text>
</svg>
